[package]
name = "prayer-times"
version = "0.4.4"
authors = ["Ilyas Turki <turki.ilyass@gmail.com>"]
edition = "2021"
description = "Islamic Prayer Times Information and Notifications"
readme = "README.md"
homepage = "https://github.com/Yasso9/prayer-times"
repository = "https://github.com/Yasso9/prayer-times"
license = "MIT"
keywords = ["prayer", "islam", "adhan", "salah", "notification"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4.6.12"
confy = "2.0.0"
env_logger = "0.11.12"
log = "0.4.35"
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = "0.28.0"
strum_macros = "0.28.0"
toml = "1.2.3"
ureq = { version = "3.5.2", default-features = false }
